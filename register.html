<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a CampusMarket account or sign in.">
    <title>CampusMarket | Student Account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="logo" href="index.html">Campus<span>Market</span> <span class="logo-badge">Uni Hub</span></a>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="catalog.html">Catalog</a>
                <a class="active" href="register.html">Account</a>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <section class="form-container">
            <!-- Account Mode Switcher Tabs -->
            <div class="tab-switcher" role="tablist" aria-label="Account Mode">
                <button type="button" class="active" id="tabRegister" role="tab" aria-selected="true">Create Account</button>
                <button type="button" id="tabLogin" role="tab" aria-selected="false">Sign In</button>
            </div>

            <div class="page-heading">
                <p class="eyebrow" id="formEyebrow">JOIN CAMPUSMARKET</p>
                <h1 id="formHeading">Create your account.</h1>
                <p id="formSubheading">Register with your university details to unlock full student marketplace features.</p>
            </div>

            <!-- Active User Session Profile Card (Shown when logged in) -->
            <div id="loggedInProfileCard" style="display: none; background: #f0f7ff; border: 1.5px solid #bfdbfe; border-radius: var(--radius-xl); padding: 24px; text-align: center; margin-bottom: 24px;">
                <div style="width: 56px; height: 56px; border-radius: var(--radius-full); background: var(--primary); color: white; display: grid; place-items: center; font-size: 1.6rem; margin: 0 auto 12px;">🎓</div>
                <h3 id="sessionUserName" style="margin: 0 0 4px; font-size: 1.2rem;">Student Name</h3>
                <p id="sessionUserEmail" style="color: var(--text-muted); font-size: 0.92rem; margin: 0 0 16px;">student@campus.local</p>
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <a href="catalog.html" class="button btn-sm">Browse Catalog &rarr;</a>
                    <button type="button" class="secondary-button btn-sm" id="btnSignOut">Sign Out</button>
                </div>
            </div>

            <form id="registrationForm" novalidate>
                <div class="form-group" id="groupFullName">
                    <label for="fullName">Full name <span aria-hidden="true">*</span></label>
                    <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="e.g. Alex Mwangi">
                    <small class="error-message" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">University email address <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="student@university.ac.ke">
                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password <span aria-hidden="true">*</span></label>
                    <div class="password-row">
                        <input type="password" id="password" name="password" autocomplete="new-password">
                        <button type="button" class="secondary-button" id="togglePassword">Show</button>
                    </div>
                    <small class="error-message" id="passwordError"></small>
                </div>

                <div class="form-group" id="groupConfirmPassword">
                    <label for="confirmPassword">Confirm password <span aria-hidden="true">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <div class="form-group checkbox-group" id="groupTerms">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms">I agree to the CampusMarket community rules and terms.</label>
                </div>
                <small class="error-message" id="termsError"></small>

                <button class="button full-width" type="submit" id="btnSubmitForm">Create Account</button>

                <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 CampusMarket. Built for the university community.</p>
        </div>
    </footer>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
