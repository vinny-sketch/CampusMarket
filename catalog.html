<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse products on CampusMarket.">
    <title>CampusMarket | Catalog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container nav-wrapper">
            <a class="logo" href="index.html">Campus<span>Market</span> <span class="logo-badge">Uni Hub</span></a>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a class="active" href="catalog.html">Catalog</a>
                <a href="register.html">Account</a>
            </nav>
        </div>
    </header>

    <main class="container page-content">
        <section class="page-heading">
            <p class="eyebrow">PRODUCT CATALOG</p>
            <h1>Find what you need.</h1>
            <p>Search or filter the catalog, then choose a quantity to calculate your total.</p>
        </section>

        <section class="catalog-controls" aria-label="Catalog filters">
            <div class="form-group">
                <label for="searchInput">Search products</label>
                <input type="search" id="searchInput" placeholder="Search by name, category, or features..." autocomplete="off">
            </div>

            <div class="form-group">
                <label for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="all">All Categories (24)</option>
                    <option value="tech">Tech & Computing</option>
                    <option value="study">Study & Stationery</option>
                    <option value="dorm">Dorm & Living</option>
                    <option value="bags">Bags & Carry</option>
                    <option value="audio">Audio & Entertainment</option>
                    <option value="wellness">Campus Wellness</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sortFilter">Sort by</label>
                <select id="sortFilter">
                    <option value="featured">Featured / Recommended</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="rating">Highest Rated</option>
                    <option value="name">Name: A to Z</option>
                </select>
            </div>
        </section>

        <nav class="category-pills" id="categoryPills" aria-label="Quick category filters">
            <button type="button" class="category-pill active" data-category="all">🏷️ All</button>
            <button type="button" class="category-pill" data-category="tech">💻 Tech</button>
            <button type="button" class="category-pill" data-category="study">📚 Study</button>
            <button type="button" class="category-pill" data-category="dorm">🛏️ Dorm</button>
            <button type="button" class="category-pill" data-category="bags">🎒 Bags</button>
            <button type="button" class="category-pill" data-category="audio">🎧 Audio</button>
            <button type="button" class="category-pill" data-category="wellness">🏃 Wellness</button>
        </nav>

        <p id="filterMessage" class="filter-message" aria-live="polite"></p>

        <section class="product-grid" id="productList" aria-label="Products">
            <!-- Dynamically populated from products.js -->
        </section>

        <p id="noResults" class="no-results" hidden>No products match your search or category.</p>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 CampusMarket. Built for the university community.</p>
        </div>
    </footer>

    <script src="products.js"></script>
    <script src="app.js"></script>
</body>
</html>
